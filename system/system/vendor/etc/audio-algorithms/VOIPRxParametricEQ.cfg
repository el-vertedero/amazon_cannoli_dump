/*
    Parametric EQ Configuration EQv5.4 for Cannoli
    options for FilterType : LOW_PASS, HIGH_PASS, BAND_PASS, NOTCH, PEAK, LOW_SHELF, HIGH_SHELF, BYPASS
    Fc : Cutoff/Center Frequency in Hertz
    Q:   Quality Factor
    GaindB: Gain in dB

*/

{
    "Bypass"            : false,
    "NumBiquads"        : 4,   // the number MUST be a multiple of 4

    "Biquad Definitions":
    [
        // Biquad 1. LOW_SHELF
        {
            "FilterType" : "LOW_SHELF",
            "Fc"         : 300,
            "Q"          : 0.7,
            "GaindB"     : -2.0
        },
        // Biquad 2. HIGH_SHELF
        {
            "FilterType" : "HIGH_SHELF",
            "Fc"         : 2500,
            "Q"          : 0.7,
            "GaindB"     : -5.0
        },
        // Biquad 3. HIGH_SHELF
        {
            "FilterType" : "HIGH_SHELF",
            "Fc"         : 5000,
            "Q"          : 0.7,
            "GaindB"     : 8.0
        },
        // Biquad 4.  Peak to attenuate frequencies around 4000 Hz by 6dB for RLR
        {
            "FilterType" : "PEAK",
            "Fc"         : 4000,
            "Q"          : 2.5,
            "GaindB"     : -2.0
        }
   ]
}
