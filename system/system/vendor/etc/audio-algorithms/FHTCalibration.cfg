{
    // Cannoli-specific device descriptor for FHT
    "Device Type": "dot5",
    "Fallback Manufacturer": "GTK",
    "Debug Directory": "/data/misc/audio/fht_debug",
    "Debug Flags": 255,

    // Assume stimulus is sent as header-less PCM, 1 channel at 48kHz
    "Stimulus WAV Header"       : false,
    "Stimulus Channels"         : 1,
    "Stimulus Sample Rate"      : 16000,
    "Stimulus Bytes per Sample" : 4,
    "Stimulus Format"           : "Float",

    // Debug feature: set this non-empty to use a local file as the stimulus
    // reference, instead of the stimulus sent from WHA.
    "Stimulus Override File": "/data/misc/audio/fht_debug/mls_dur500ms_bw0.9.raw",

    // Global processing expects 1500ms of audio after the end of the wakeword,
    // plus an additional 500ms of padding, so listen a little more than that.
    "Listen After Wakeword End ms": 3000,

    // AoA histogram config matches Python implementation in
    // https://code.amazon.com/reviews/CR-104189842
    "Num AWD Angles": 30,
    "Normalize AWD Histogram": true,
    "Histogram Samples Before WW": 2560,
    "Histogram Samples After WW": 15360,

    "Global Config":
    {
        "numMics"       : 3,
        "numRefs"       : 1,
        "samplingRate"  : 16000,
        "frameLen"      : 128,
        "AwdAOA"        : false
    },
    "AARLocalization":
    {
        "SelectFirstPeak"      : true,
        "ThresholdMult"        : 2.0,
        "Percentile"           : 99,
        "Bypass"               : false,
        "SingleMicRangeEst"    : 10,
        "FrameLen"             : 256,
        "Channels"             : 3,
        "Bias"                 : 0.003,
        "InitialValue"         : 0.02,
        "StepSize"             : 0.0003,
        "ExpectedPeakBufSamples" : 8000,
        "DumpPrefix"             : "./"
    },
    "Convolution": {
        "Bypass"                : false,
        "Partition Length"      : 512,
        "FFT Size"              : 1024,
        "External Coefficients" : [ "EQ_100.cfg" ],
        "Volume Boundary"       : [ 100 ]  // The last number needs to be 100
    },

    "Peak Music":
    {
     "Num Channels"       : 3,
     "Sampling Rate"      : 16000,
     // CanCheese PeakMUSIC dictionary created from s3://audioalg-dev/users/zhensun/miscs/BrownieFreeField_micFarField.mat
     // Using only mics [0, 1, 3].
     "Dictionary"         : "peakmusic_dict_cancheese.cfg",
     "Dictionary Azimuths": "peakmusic_dict_az_deg.cfg",
     "Dictionary Polars"  : "peakmusic_dict_polar_deg.cfg",
     "Dictionary Freqs"   : "peakmusic_dict_freq.cfg",
     "FFT Length"         : 64,
     "Window"             : "peakmusic_window.cfg",
     "Freq Range"         : [400, 6000],
     "Polar Range Deg"    : [90, 90]
    },

    "FullAWDSSL AOA User":
    {
        "History Size (frames)"             : 128,   // Buffer of history frames
        "Search Augment Factor"             : 1,

        "AWD FilterBank":
        { // uses simple Hanning window with 4x overlap
            "FFT Len"               : 512, //1024, //256, // 
            "Decimation Rate"       : 128,
            "FilterLen"             : 2048, //1280, // 512, //
            "AnaSynFilterCoefs"     : "coefs_AnaFilterBank_M512_2048.cfg"
        },

        "AWD Analysis":
        {
            "AWD Dictionary File"               : "brownie512_deg4_3mic_124_5elev_norm.dat",        // "Brownie with mic dropped" dictionary, normalized, from mmansou@ on 20231107
            "AWD Angle File"                    : "brownie_angle512_deg4_3actmic_124_5elev.cfg",    // "Brownie with mic dropped" dictionary, from tamzeed@ on 20230711

            "Enable PCA Dict"                   : false, //true, // 
            "PCA Min Freq (Hz)"                 : 0.0, 
            "PCA Max Freq (Hz)"                 : 2000,

            "Normalization Enable"              : true, // false, // 
            "Process Min Freq (Hz)"             : 250,   // From tamzeed@ on 20230911, https://quip-amazon.com/mPOQAj7mi7KM/FHT-AFE-Hyper-FullAWD-Tuning
            "Process Max Freq (Hz)"             : 6950,  // From tamzeed@ on 20230911, https://quip-amazon.com/mPOQAj7mi7KM/FHT-AFE-Hyper-FullAWD-Tuning

            "Energy Time Constant"              : 0.005, //0.05, // for estimating RMS energy (per frame)
            "Matched Filter Time Constant"      : 1.0, //  
            "RMS Search Threshold"              : 0.1, // 1.0,  // scale factor from RMS to enable search  (0: always on)
            "Incumbent Gain"                    : 1.0,
            "Filterbank Delay (frames)"         : 8, //14, //  10, // .....

            "LPC Enable"                        : false,


            "Enable Search Weights"             : true,
            "Enable Output Weights"             : false,
            "Input Freq. Normalization Flag"    : true,  // defualt false
            "Output Freq. Restore Flag"         : false,

            // MSS Solver parameters
            "Matched Filter Freq Bins"          : 64,
            "Matched Filter Out Components"     : 20,
            "Matched Filter Power Threshold"    : 0.2,
            "Matched Filter Nbr Weight"         : 0.0, // default 1.0

            "Intermed Solver Freq Bins"         : 64,
            "Intermed Solver Max Iterations"    : 10,      
            "Intermed Solver Lambda1"           : 2e-1, // 1e0, //       
            "Intermed Solver Lambda2"           : 1e-0,      
            "Intermed Solver mu"                : 1.0,     

            "Component Solver Max Iterations"   : 20, //  

            "Component Solver Lambda Scale"     : 10.0, //50.0, // 4.0, // 100.0,      
            "Component Solver Lambda1"          : 0.027, // From tamzeed@ on 20230911, https://quip-amazon.com/mPOQAj7mi7KM/FHT-AFE-Hyper-FullAWD-Tuning
            "Component Solver Lambda2"          : 0.1,   // From tamzeed@ on 20230911, https://quip-amazon.com/mPOQAj7mi7KM/FHT-AFE-Hyper-FullAWD-Tuning
            "Intermed Solver Lambda Scale"      : 5.0,   // From tamzeed@ on 20230911, https://quip-amazon.com/mPOQAj7mi7KM/FHT-AFE-Hyper-FullAWD-Tuning

            "Lambda Scaling Cutoff (Hz)"        : 500.0,

            "Number of Output Components"       : 12,    // From tamzeed@ on 20230911, https://quip-amazon.com/mPOQAj7mi7KM/FHT-AFE-Hyper-FullAWD-Tuning
            "Energy Floor"                      : 0.0, // 1e-10, // 1e-8, // 

            "Search Interval (frames)"          : 4, 
            "Align and Add Enable"              : false,

            "All Elev Nbr Flag"                 : false, //  
            "Distance-based Nbr Flag"           : true, //  
            "Next Elev Nbr Flag"                : true, //false, //
            "Neighbor Margin"                   : 23.0,  // From tamzeed@ on 20230911, https://quip-amazon.com/mPOQAj7mi7KM/FHT-AFE-Hyper-FullAWD-Tuning
            "Big Neighbor Margin"               : 31.0 // 11.0 // 
        },

        "Frequncy Zones Raw Mic"            : [250.0, 5000], // [250.0, 2000.0, 4000.0, 6000.0, 7500.0],  // boundaries of frequency zones in Hz

        "Maximum Frequency SNR Attenuation" : 0.1,  // maximum attenuation of frequenceis
        "SNR Cap (dB)"                      : 10, //   cap for SNR for freq components

        "ERLE delay (frames)"               : 8, //

        "MaxVal Threshold"                  : 0.2, //     ############### 

        "Max Freq Attenuation"              : 1.0, //
        "Frequency Attenuation Midpt (Hz)"  : 4000, //6000, //


        // additional search control params
        "Azimuth Region (degrees)"          : 38.0,      // From tamzeed@ on 20230911, https://quip-amazon.com/mPOQAj7mi7KM/FHT-AFE-Hyper-FullAWD-Tuning
        "Diffuse Angle Variance (deg^2)"    : 90.0,      // From tamzeed@ on 20230911, https://quip-amazon.com/mPOQAj7mi7KM/FHT-AFE-Hyper-FullAWD-Tuning

        "Mimimum TD Freq Bins Count"        : 10, // 30, 
        "Correlation Coef Threshold"        : 0.004,

        "Active Freq. Count Ratio"          : 0.1,

        "Nominal TD std (samples)"          : 0.1,
        "No Xcor Components Penalty"        : -5.0, 
        "TD Absence Penalty"                : -20.0,

        "TD Qval Threshold"                 : 0.0, 
        "TD Freq Spacing (vbd)"             : 1,

        "Amplitude Absence Penalty"         : -20.0,
        "Amplitude Power Theshold"          : 0.8, 
        "Amp. Active Count Threshold"       : 0.25,
        "Amp. Minimum Active Count"         : 10,

        "Estimatation mean SER Margin (dB)" : 10.0,
        "Estimatation mean Eneragy Margin"  : 0.1,

        "Kalman Enable"                     : false, // true,
        "Enable ERF"                        : false //true, //  
    },

